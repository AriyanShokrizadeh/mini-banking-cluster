# Active/Passive Banking API: fixed lab addresses: VM1 primary, VM2 backup.
# Financial POST retries belong to the idempotent client, not the proxy.
global
    log /dev/log local0
    maxconn 500

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 15s
    timeout server 15s
    timeout check 8s

frontend banking_frontend
    bind *:8080
    default_backend banking_api

backend banking_api
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 10s fall 2 rise 2
    retries 0

    server banking_a 192.168.200.128:8000 check
    server banking_b 192.168.200.129:8000 check backup
