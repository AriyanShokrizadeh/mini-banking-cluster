# Optional Git hooks. Without Git, run `make check` from the project root.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: bash-syntax
        name: Bash syntax
        entry: bash -n
        language: system
        files: \.sh$
      - id: unit-tests
        name: Local tests (manual)
        entry: pytest -q -m 'not cluster'
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
      - id: type-check
        name: Pyright (manual)
        entry: pyright
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
