name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: uv sync --group dev
      - name: Run deterministic, non-cluster tests
        run: uv run pytest -q -m 'not cluster'
      # Ruff enforcement will be enabled after the source-code formatting phase.
